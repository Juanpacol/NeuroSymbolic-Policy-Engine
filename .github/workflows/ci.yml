name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Linting needs no torch, so it skips the multi-hundred-megabyte
      # install entirely and reports within seconds.
      - run: pip install "ruff>=0.6,<0.13"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The bounds declared in pyproject.toml's requires-python.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The CPU wheel first, and on its own index: the default PyPI
      # torch drags ~2.5GB of CUDA runtime onto a runner that has no
      # GPU to use it on.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -q

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # train's extras (pillow, in particular) are needed too: PIL.Image
      # is imported at module level in nspe/data/hateful_memes.py, so
      # mypy --strict needs it installed to type-check that file at all.
      - run: pip install -e ".[dev,train]"
      - run: mypy nspe/
