[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurosymbolic-policy-engine"
version = "0.1.0"
description = "Differentiable neurosymbolic reasoning over policy knowledge graphs for auditable content moderation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Juan Pablo Botero Espinosa" }]
dependencies = [
    "torch>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
clip = ["open_clip_torch>=2.24", "pillow>=10.0"]
data = ["datasets>=2.19", "huggingface_hub>=0.23", "pillow>=10.0"]
bench = ["clingo>=5.7", "pandas>=2.0"]
train = ["open_clip_torch>=2.24", "pillow>=10.0", "datasets>=2.19", "huggingface_hub>=0.23"]
dev = [
    "pytest>=8.0",
    # Upper bounds so a new lint release cannot redden CI on an
    # unrelated pull request.
    "ruff>=0.6,<0.13",
    "mypy>=1.10,<2.0",
    # test_bench_cli and test_clingo_agreement import clingo without a
    # guard, so without it here `pip install -e ".[dev]" && pytest`
    # fails at collection. An importorskip would be worse: the
    # agreement test is H2's core credibility artifact and must never
    # be allowed to silently stop running.
    "clingo>=5.7",
    "hypothesis>=6.100",
    "expecttest>=0.2",
    "numpy>=1.26",
    "types-PyYAML>=6.0",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["nspe"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.per-file-ignores]
# Test classes and methods document themselves through their names; the
# docstrings that matter in `test/` are the module-level ones saying what
# a file is defending against, and those stay required. E, F, I, UP and B
# stay live on tests -- an unused import or a bare `zip` is as much a bug
# there as anywhere.
"test/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["nspe"]

[tool.pytest.ini_options]
testpaths = ["test"]
