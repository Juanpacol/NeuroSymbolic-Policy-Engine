[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurosymbolic-policy-engine"
version = "0.1.0"
description = "Differentiable neurosymbolic reasoning over policy knowledge graphs for auditable content moderation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Juan Pablo Botero Espinosa" }]
dependencies = [
    "torch>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
clip = ["open_clip_torch>=2.24"]
bench = ["clingo>=5.7", "pandas>=2.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "expecttest>=0.2",
    "numpy>=1.26",
    "types-PyYAML>=6.0",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["nspe"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["nspe"]

[tool.pytest.ini_options]
testpaths = ["test"]
